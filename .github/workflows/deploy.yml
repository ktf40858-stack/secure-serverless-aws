name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the workflow token. id-token is only granted to the AWS jobs.
# Every third-party action is pinned to a full commit SHA (threat model E3): a moved or hijacked
# tag cannot change the code that runs with AWS credentials. The comment keeps the readable version.
permissions:
  contents: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  checks:
    name: Tests and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Unit tests
        run: |
          pip install -r app/api/requirements-dev.txt
          pytest -q app/api/tests app/remediation/tests

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/security; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # Any failed Checkov check fails the build: insecure infrastructure never reaches AWS.
      - name: Checkov (IaC security gate)
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --compact

  plan:
    name: Terraform plan (dev)
    needs: checks
    # AWS jobs run only once the account exists: set the repository variable AWS_READY=true.
    # Push to main only: the deploy role does not trust pull_request tokens (see github_oidc.tf).
    if: vars.AWS_READY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Short-lived credentials through OIDC: no AWS keys are stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color -out=tfplan

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          # The saved plan points to the Lambda zip, so both travel together to the apply job.
          path: |
            terraform/envs/dev/tfplan
            terraform/envs/dev/build/api.zip
          retention-days: 1

  apply:
    name: Terraform apply (dev)
    needs: plan
    if: vars.AWS_READY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The "dev" environment requires a manual approval in GitHub before this job runs.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: terraform/envs/dev

      - name: Apply the reviewed plan
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform apply -input=false -no-color tfplan
